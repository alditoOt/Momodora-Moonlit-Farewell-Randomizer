name: Build

on:
  pull_request:
    branches: [ Archipelago-Randomizer ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Game/MelonLoader DLLs are kept in a private repo and never committed here.
      # Layout in that repo mirrors the game folder (MelonLoader/, MomodoraMoonlitFarewell_Data/Managed/).
      - uses: actions/checkout@v4
        with:
          repository: alditoOt/momodora-build-refs
          token: ${{ secrets.REFS_REPO_TOKEN }}
          path: game-refs

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore APMomodoraMoonlitFarewell/APMomodoraMoonlitFarewell.sln

      - name: Build
        run: msbuild APMomodoraMoonlitFarewell/APMomodoraMoonlitFarewell.sln /p:Configuration=Release /p:GameDir="${{ github.workspace }}\game-refs"
